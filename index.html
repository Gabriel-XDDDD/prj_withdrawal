<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cuenta en efectivo</title><style>
*{box-sizing:border-box}body{background:#f3f5f0;color:#182a25;font:16px system-ui;margin:0}main{max-width:780px;margin:5vh auto;padding:22px}header{background:#193e35;color:white;padding:28px;border-radius:14px}header strong{display:block;font-size:2.6rem}form,article{background:white;margin:16px 0;padding:20px;border-radius:12px}label{display:block;margin-bottom:6px}input,button{font:inherit;padding:12px;border:1px solid #76847d;border-radius:6px}button{background:#225447;color:white;cursor:pointer;margin-top:8px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid #ddd}article{overflow:auto}caption{text-align:left;font-weight:bold;font-size:1.3rem;padding-bottom:10px}</style>
<main><h1>Cuenta en efectivo</h1><header>Saldo disponible<strong>S/ {{soles .Balance}}</strong></header><form method="post" action="/movimiento"><label for="monto">Monto en soles</label><input id="monto" name="monto" required inputmode="decimal" placeholder="0.00"><button name="operacion" value="abono">Abonar</button> <button name="operacion" value="retiro">Retirar</button></form><article><table><caption>Historial de movimientos</caption><tr><th>N.º</th><th>Operación</th><th>Monto</th><th>Resultado</th><th>Saldo</th></tr>{{range .History}}<tr><td>{{.ID}}</td><td>{{.Operation}}</td><td>{{.Input}}</td><td>{{.Status}} · {{.Message}}</td><td>{{soles .After}}</td></tr>{{else}}<tr><td colspan="5">Aún no hay movimientos.</td></tr>{{end}}</table></article></main></html>
