name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar formato
        run: test -z "$(gofmt -l .)"
      - name: Analizar código
        run: go vet ./...
      - name: Ejecutar pruebas Go
        run: go test -race -count=1 -cover ./...
      - name: Instalar Behave
        run: python -m pip install --disable-pip-version-check behave==1.3.3
      - name: Ejecutar escenarios Gherkin
        run: python -m behave
